<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Resume Builder ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 55%, #24243e 100%);
            color: #e2e8f0;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 24px;
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.4);
            color: #a5b4fc; font-size: 0.75rem; font-weight: 700;
            padding: 0.3rem 0.9rem; border-radius: 50rem;
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem;
        }
        h1 { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem; }
        .sub { color: rgba(255,255,255,0.45); font-size: 0.9rem; margin-bottom: 1.8rem; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 0.4rem; }
        input {
            width: 100%; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
            color: #fff; padding: 0.75rem 1rem; font-size: 0.9rem;
            font-family: inherit; margin-bottom: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.35); }
        .btn {
            width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer; color: white;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 8px 24px rgba(99,102,241,0.35);
            transition: all 0.3s; margin-top: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.5); }
        .alert {
            background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3);
            border-radius: 10px; padding: 0.7rem 1rem; color: #fca5a5;
            font-size: 0.85rem; margin-bottom: 1rem;
        }
        .success {
            background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
            color: #6ee7b7;
        }
        .foot { text-align: center; margin-top: 1.5rem; }
        .foot a { color: rgba(255,255,255,0.45); text-decoration: none; font-size: 0.83rem; margin: 0 0.6rem; transition: color .2s; }
        .foot a:hover { color: #a5b4fc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🔐 Account</div>
        <h1>Welcome Back</h1>
        <p class="sub">Login to access your saved resumes</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert success">{{ success }}</div>
        {% endif %}

        <form action="/login" method="post">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="foot">
            <a href="/register">Don't have an account? Register</a>
            <a href="/">← Home</a>
        </div>
    </div>
</body>
</html>
