<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Targeted Resume Matching | Select Your Role</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #6366f1;
            --accent: #10b981;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent);
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2.5rem;
        }

        .role-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-select-dark {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.8rem;
            border-radius: 12px;
        }

        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .btn-analyze {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -5px rgba(99, 102, 241, 0.5);
        }

        input[type="file"] {
            display: none;
        }

        .home-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .home-link a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="glass-panel">
    <h1>JD Matching <br><span style="color:var(--primary);">Role-Based</span></h1>
    <p class="subtitle">Select your target role and upload your resume for a targeted gap analysis and project recommendations.</p>

    <form action="/analyze-role" method="post" enctype="multipart/form-data">
        <label class="form-label text-muted small mb-2">TARGET JOB ROLE</label>
        <select name="role" class="form-select form-select-dark mb-4" required>
            <option value="" disabled selected>Choose a role...</option>
            {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
            {% endfor %}
        </select>

        <label class="form-label text-muted small mb-2">RESUME (PDF)</label>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-file-pdf fa-2x mb-2" style="color:var(--primary);"></i>
            <p id="fileName" class="mb-0">Drag or click to upload resume</p>
            <input type="file" name="file" id="fileInput" accept="application/pdf" onchange="updateFileName()">
        </div>

        <button type="submit" class="btn btn-primary btn-analyze">
            <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Get Targeted Analysis
        </button>
    </form>

    <div class="home-link">
        <a href="/"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a>
    </div>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('fileInput');
        const display = document.getElementById('fileName');
        if (input.files.length > 0) {
            display.textContent = input.files[0].name;
            display.style.color = "#6ee7b7";
        }
    }
</script>

</body>
</html>
