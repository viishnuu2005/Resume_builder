<!-- Chatbot Widget UI -->
<style>
  .chatbot-wrapper {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 9999;
      font-family: inherit;
  }
  .chat-toggle-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      border: none;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
  }
  .chat-toggle-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
  }
  .chat-toggle-btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      opacity: 0;
      z-index: -1;
      animation: pulse-ring 2s infinite;
  }
  @keyframes pulse-ring {
      0% {
          transform: scale(0.8);
          opacity: 1;
      }
      100% {
          transform: scale(1.4);
          opacity: 0;
      }
  }
  .chat-window {
      position: absolute;
      bottom: 80px;
      right: 0;
      width: 360px;
      height: 520px;
      background: rgba(20, 22, 35, 0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0);
      transform-origin: bottom right;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      pointer-events: none;
  }
  .chat-window.open {
      transform: scale(1);
      opacity: 1;
      pointer-events: all;
  }
  .chat-header {
      background: rgba(255,255,255,0.03);
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
  }
  .chat-header h5 {
      margin: 0;
      font-size: 1.05rem;
      color: #f8fafc;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
  }
  .chat-status {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
  }
  @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
  }
  .chat-close {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
  }
  .chat-close:hover {
      color: #fff;
  }
  .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 17, 23, 0.5);
  }
  .chat-body::-webkit-scrollbar {
      width: 5px;
  }
  .chat-body::-webkit-scrollbar-track {
      background: transparent;
  }
  .chat-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
  }
  .chat-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
      animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
      from {
          opacity: 0;
          transform: translateY(10px);
      }
      to {
          opacity: 1;
          transform: translateY(0);
      }
  }
  .chat-bubble.bot {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
  }
  .chat-bubble.bot.thinking {
      background: rgba(99, 102, 241, 0.15);
  }
  .chat-bubble.user {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
  }
  .chat-typing {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
  }
  .chat-typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      animation: typing 1.4s infinite;
  }
  .chat-typing span:nth-child(2) {
      animation-delay: 0.2s;
  }
  .chat-typing span:nth-child(3) {
      animation-delay: 0.4s;
  }
  @keyframes typing {
      0%, 60%, 100% {
          opacity: 0.4;
          transform: translateY(0);
      }
      30% {
          opacity: 1;
          transform: translateY(-8px);
      }
  }
  .quick-suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
  }
  .suggestion-btn {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
  }
  .suggestion-btn:hover {
      background: rgba(99, 102, 241, 0.35);
      border-color: rgba(99, 102, 241, 0.5);
  }
  .chat-footer {
      padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 8px;
      align-items: flex-end;
  }
  .chat-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
  }
  .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
      resize: none;
      max-height: 100px;
  }
  .chat-input:focus {
      background: rgba(255,255,255,0.1);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
  }
  .chat-input::placeholder {
      color: rgba(255,255,255,0.35);
  }
  .chat-send-btn {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      min-width: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
  }
  .chat-send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .chat-send-btn:active {
      transform: scale(0.95);
  }
  @media (max-width: 480px) {
      .chat-window {
          width: calc(100vw - 60px);
          height: 60vh;
          max-height: 500px;
      }
      .chatbot-wrapper {
          bottom: 20px;
          right: 20px;
      }
  }
</style>

<div class="chatbot-wrapper">
  <div class="chat-window" id="chatWindow">
      <div class="chat-header">
          <h5>
              <i class="fa-solid fa-robot" style="color:#6ee7b7;"></i> 
              Resume Assistant 
              <span class="chat-status"></span>
          </h5>
          <button class="chat-close" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="chat-body" id="chatBody">
          <div class="chat-bubble bot">
              <strong>Welcome! 👋</strong><br><br>
              I'm your AI Resume Assistant. I can help you:
              <div class="quick-suggestions">
                  <button class="suggestion-btn" onclick="sendSuggestedMessage('rewrite: I managed a team of developers')">💬 Rewrite bullet points</button>
                  <button class="suggestion-btn" onclick="sendSuggestedMessage('How can I improve my ATS score?')">📈 Improve ATS score</button>
                  <button class="suggestion-btn" onclick="sendSuggestedMessage('What keywords should I add?')">🔑 Find missing keywords</button>
                  <button class="suggestion-btn" onclick="sendSuggestedMessage('How do I format my resume?')">📋 Resume formatting tips</button>
              </div>
          </div>
      </div>
      <div class="chat-footer">
          <div class="chat-input-group">
              <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything or 'rewrite: ...'" onkeypress="handleChatEnter(event)">
          </div>
          <button class="chat-send-btn" onclick="sendMessage()" title="Send message"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
  </div>
  <button class="chat-toggle-btn" onclick="toggleChat()" id="chatBtn" title="Chat with AI Assistant">
      <i class="fa-solid fa-message"></i>
  </button>
</div>

<script>
  let chatOpen = false;
  let isWaitingForResponse = false;

  function toggleChat() {
      const window = document.getElementById('chatWindow');
      const btnIcon = document.querySelector('#chatBtn i');
      chatOpen = !chatOpen;
      
      if (chatOpen) {
          window.classList.add('open');
          btnIcon.classList.remove('fa-message');
          btnIcon.classList.add('fa-xmark');
          setTimeout(() => document.getElementById('chatInput').focus(), 300);
      } else {
          window.classList.remove('open');
          btnIcon.classList.remove('fa-xmark');
          btnIcon.classList.add('fa-message');
      }
  }

  function appendMessage(text, sender, isTyping = false) {
      const body = document.getElementById('chatBody');
      const bubble = document.createElement('div');
      
      if (isTyping) {
          bubble.className = 'chat-typing';
          bubble.innerHTML = '<span></span><span></span><span></span>';
      } else {
          bubble.className = `chat-bubble ${sender}`;
          bubble.innerHTML = text;
      }
      
      bubble.id = isTyping ? 'typingIndicator' : '';
      body.appendChild(bubble);
      body.scrollTop = body.scrollHeight;
  }

  function handleChatEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
      }
  }

  function sendSuggestedMessage(message) {
      document.getElementById('chatInput').value = message;
      sendMessage();
  }

  function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || isWaitingForResponse) return;

      appendMessage('<strong>You:</strong><br>' + escapeHtml(text), 'user');
      input.value = '';
      isWaitingForResponse = true;
      
      appendMessage('', '', true);

      fetch('/chat', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
      })
      .then(res => res.json())
      .then(data => {
          // Remove typing indicator
          const typingIndicator = document.getElementById('typingIndicator');
          if (typingIndicator) typingIndicator.remove();
          
          const response = data.response || "I'm not sure how to help with that. Try asking about ATS optimization, resume formatting, or rewriting your experience bullets.";
          appendMessage('<strong>Assistant:</strong><br>' + response, 'bot');
          isWaitingForResponse = false;
      })
      .catch(err => {
          const typingIndicator = document.getElementById('typingIndicator');
          if (typingIndicator) typingIndicator.remove();
          appendMessage("Sorry, I'm having trouble connecting. Please try again.", 'bot');
          isWaitingForResponse = false;
          console.error(err);
      });
  }

  function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
  }
</script>
